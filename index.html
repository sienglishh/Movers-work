<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flashcards Từ Vựng Tiếng Anh - Work</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Comic Sans MS', 'Chalkboard SE', 'Segoe UI', sans-serif;
    }

    body {
      background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    h1 {
      color: #ffffff;
      margin-bottom: 20px;
      font-size: 2rem;
      text-align: center;
      text-shadow: 0 2px 4px rgba(0,0,0,0.2);
    }

    .card {
      width: 340px;
      height: 420px;
      background: #ffffff;
      border-radius: 25px;
      box-shadow: 0 12px 25px rgba(0,0,0,0.15);
      border: 5px solid #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 30px 20px;
    }

    .icon {
      font-size: 5rem;
      margin-top: 10px;
    }

    .text-container {
      text-align: center;
    }

    .word {
      font-size: 2.1rem;
      font-weight: bold;
      color: #d63031;
      margin-bottom: 8px;
    }

    .meaning {
      font-size: 1.5rem;
      font-weight: bold;
      color: #6c5ce7;
    }

    .btn-audio {
      background: #d63031;
      color: white;
      border: none;
      padding: 10px 22px;
      border-radius: 50px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(214, 48, 49, 0.3);
      transition: transform 0.1s, background 0.2s;
    }

    .btn-audio:hover {
      background: #ff7675;
      transform: scale(1.05);
    }

    .controls {
      margin-top: 30px;
      display: flex;
      gap: 20px;
      align-items: center;
    }

    .btn-nav {
      background: #6c5ce7;
      color: white;
      border: none;
      padding: 12px 25px;
      border-radius: 15px;
      font-size: 1.1rem;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(108, 92, 231, 0.3);
      transition: background 0.2s, transform 0.1s;
    }

    .btn-nav:hover {
      background: #a29bfe;
      transform: scale(1.05);
    }

    .progress {
      font-size: 1.2rem;
      font-weight: bold;
      color: #2d3436;
      background: rgba(255,255,255,0.85);
      padding: 8px 16px;
      border-radius: 20px;
    }
  </style>
</head>
<body>

  <h1>💼 Work & Jobs 👨‍⚕️</h1>

  <div class="card">
    <div class="icon" id="icon">🎪</div>
    
    <div class="text-container">
      <div class="word" id="word">circus</div>
      <div class="meaning" id="meaning">gánh xiếc</div>
    </div>

    <button class="btn-audio" onclick="speakCurrentWord()">🔊 Nghe đọc</button>
  </div>

  <div class="controls">
    <button class="btn-nav" onclick="prevCard()">◄ Trước</button>
    <div class="progress" id="progress">1 / 13</div>
    <button class="btn-nav" onclick="nextCard()">Sau ►</button>
  </div>

  <script>
    const vocabulary = [
      { word: "circus", meaning: "gánh xiếc", icon: "🎪" },
      { word: "clown", meaning: "chú hề", icon: "🤡" },
      { word: "cook", meaning: "đầu bếp", icon: "🧑‍🍳" },
      { word: "dentist", meaning: "nha sĩ", icon: "🦷" },
      { word: "doctor", meaning: "bác sĩ", icon: "👨‍⚕️" },
      { word: "driver", meaning: "tài xế", icon: "🚗" },
      { word: "farmer", meaning: "nông dân", icon: "👨‍🌾" },
      { word: "film (US movie) star", meaning: "ngôi sao điện ảnh", icon: "🌟" },
      { word: "hospital", meaning: "bệnh viện", icon: "🏥" },
      { word: "nurse", meaning: "y tá", icon: "👩‍⚕️" },
      { word: "pirate", meaning: "cướp biển", icon: "🏴‍☠️" },
      { word: "pop star", meaning: "ngôi sao nhạc pop", icon: "🎤" },
      { word: "work", meaning: "làm việc / công việc", icon: "💼" }
    ];

    let currentIndex = 0;
    const wordElement = document.getElementById('word');
    const meaningElement = document.getElementById('meaning');
    const iconElement = document.getElementById('icon');
    const progressElement = document.getElementById('progress');

    function updateCard() {
      const item = vocabulary[currentIndex];
      wordElement.textContent = item.word;
      meaningElement.textContent = item.meaning;
      iconElement.textContent = item.icon;
      progressElement.textContent = `${currentIndex + 1} / ${vocabulary.length}`;
    }

    function prevCard() {
      if (currentIndex > 0) {
        currentIndex--;
        updateCard();
      }
    }

    function nextCard() {
      if (currentIndex < vocabulary.length - 1) {
        currentIndex++;
        updateCard();
      }
    }

    function speakCurrentWord() {
      const textToSpeak = vocabulary[currentIndex].word.replace(/\(.*?\)/g, '').trim();
      const utterance = new SpeechSynthesisUtterance(textToSpeak);
      utterance.lang = 'en-US';
      utterance.rate = 0.85;
      window.speechSynthesis.speak(utterance);
    }

    updateCard();
  </script>
</body>
</html>
